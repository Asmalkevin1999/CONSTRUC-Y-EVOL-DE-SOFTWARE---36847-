services:
  postgres:
    image: postgres:17
    container_name: biblioteca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y configura POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca_db}
    ports:
      - "5434:5432"
    volumes:
      - biblioteca_pgdata:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biblioteca} -d ${POSTGRES_DB:-biblioteca_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  biblioteca_pgdata:
